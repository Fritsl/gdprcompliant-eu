<title>GDPRcompliant.eu Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* GDPRcompliant.eu — prototype design system (X-01)
   Tokens and component CSS port to the real app at F-01 unchanged.
   The .proto-* chrome is scaffolding and does not port. */

:root{
  --paper:#f4f6fa; --surface:#ffffff; --surface-2:#eaeff7; --surface-3:#dfe6f1;
  --ink:#0f1a2e; --ink-2:#3d4a63; --ink-3:#6b7790;
  --rule:#d5dde9; --rule-2:#b6c2d4;
  --eu:#003399; --eu-soft:#e5ecfa; --eu-line:#b9caee;
  --gold:#ffcc00; --gold-deep:#7a5c00; --gold-soft:#fff5d1;
  --crit:#a81f16; --crit-bg:#fbeae8; --crit-line:#eec6c1;
  --warn:#8a5a00; --warn-bg:#fdf2df; --warn-line:#eddcb6;
  --adv:#3d4a63;  --adv-bg:#eef1f6;  --adv-line:#ccd5e3;
  --ok:#0f5c45;   --ok-bg:#e2f1eb;   --ok-line:#bcdccf;
  --shadow:0 1px 2px rgba(15,26,46,.06), 0 8px 24px -16px rgba(15,26,46,.28);
  --shadow-lg:0 2px 6px rgba(15,26,46,.08), 0 24px 48px -24px rgba(15,26,46,.4);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:Newsreader,Georgia,"Times New Roman",serif;
  --sans:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0a1019; --surface:#111a29; --surface-2:#182234; --surface-3:#212d43;
    --ink:#e9eef7; --ink-2:#b2becf; --ink-3:#8492a8;
    --rule:#233047; --rule-2:#33425c;
    --eu:#83a8ff; --eu-soft:#152340; --eu-line:#2b3f66;
    --gold:#ffcc00; --gold-deep:#ffd94f; --gold-soft:#2c2410;
    --crit:#ff9184; --crit-bg:#301a19; --crit-line:#4d2a26;
    --warn:#f2bd63; --warn-bg:#2b2314; --warn-line:#463620;
    --adv:#b2becf;  --adv-bg:#1b2436;  --adv-line:#2c3950;
    --ok:#74dcb0;   --ok-bg:#0f2a22;   --ok-line:#1e4438;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 24px 48px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#0a1019; --surface:#111a29; --surface-2:#182234; --surface-3:#212d43;
  --ink:#e9eef7; --ink-2:#b2becf; --ink-3:#8492a8;
  --rule:#233047; --rule-2:#33425c;
  --eu:#83a8ff; --eu-soft:#152340; --eu-line:#2b3f66;
  --gold:#ffcc00; --gold-deep:#ffd94f; --gold-soft:#2c2410;
  --crit:#ff9184; --crit-bg:#301a19; --crit-line:#4d2a26;
  --warn:#f2bd63; --warn-bg:#2b2314; --warn-line:#463620;
  --adv:#b2becf;  --adv-bg:#1b2436;  --adv-line:#2c3950;
  --ok:#74dcb0;   --ok-bg:#0f2a22;   --ok-line:#1e4438;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 24px 48px -24px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--eu); outline-offset:2px; border-radius:4px}
h1,h2,h3,h4{margin:0}
p{margin:0 0 1em}
.mono{font-family:var(--mono)}

/* ─────────────────────────────────── prototype chrome (does not port) */
.proto-bar{
  position:sticky; top:0; z-index:60; background:var(--surface); border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:14px; padding:9px clamp(12px,3vw,22px); flex-wrap:wrap;
}
.proto-badge{
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--gold-deep); background:var(--gold-soft); border:1px solid var(--gold);
  padding:4px 9px; border-radius:4px; white-space:nowrap;
}
.proto-name{font-family:var(--mono); font-size:12px; color:var(--ink-3); white-space:nowrap}
.proto-name b{color:var(--ink); font-weight:600}
.proto-nav{display:flex; gap:3px; overflow-x:auto; margin-left:auto; scrollbar-width:thin}
.proto-nav button{
  background:none; border:1px solid transparent; border-radius:6px; padding:5px 10px;
  font-size:12.5px; color:var(--ink-3); white-space:nowrap;
}
.proto-nav button:hover{color:var(--ink); background:var(--surface-2)}
.proto-nav button[aria-current="true"]{color:var(--eu); background:var(--eu-soft); border-color:var(--eu-line); font-weight:600}
.proto-note{
  background:var(--gold-soft); border-bottom:1px solid var(--gold); padding:7px clamp(12px,3vw,22px);
  font-size:12.5px; color:var(--gold-deep); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
}
.proto-note b{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase}
.screen{padding:clamp(20px,4vw,40px) clamp(16px,4vw,40px) 80px; max-width:1180px; margin-inline:auto}
.screen.narrow{max-width:840px}

/* ─────────────────────────────────── shared product components */
.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.h-serif{font-family:var(--serif); font-weight:500; letter-spacing:-.014em; line-height:1.12}
.btn{
  display:inline-flex; align-items:center; gap:8px; border-radius:7px; padding:10px 18px;
  font-size:14.5px; font-weight:600; border:1px solid var(--eu); background:var(--eu); color:#fff;
  text-decoration:none; transition:filter .12s;
}
:root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn{color:#0a1019}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn:hover{filter:brightness(1.1)}
.btn-2{background:var(--surface); color:var(--ink); border-color:var(--rule-2)}
.btn-2:hover{background:var(--surface-2); filter:none}
.btn-sm{padding:6px 12px; font-size:13px; border-radius:6px}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:10px}
.pad{padding:clamp(18px,3vw,26px)}
.sev{
  font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  padding:3px 8px; border-radius:4px; border:1px solid; white-space:nowrap; display:inline-flex; align-items:center; gap:5px;
}
.sev::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.sev-blocking{color:var(--crit); background:var(--crit-bg); border-color:var(--crit-line)}
.sev-blocking::before{border-radius:1px}
.sev-serious{color:var(--warn); background:var(--warn-bg); border-color:var(--warn-line)}
.sev-serious::before{border-radius:50%}
.sev-advisory{color:var(--adv); background:var(--adv-bg); border-color:var(--adv-line)}
.sev-advisory::before{width:7px; height:2px; border-radius:0}
.sev-closed{color:var(--ok); background:var(--ok-bg); border-color:var(--ok-line)}
.sev-closed::before{width:7px; height:7px; border-radius:50%}
.tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  padding:3px 8px; border-radius:4px; border:1px solid; white-space:nowrap;
}
.t-self_fix{color:var(--ok); background:var(--ok-bg); border-color:var(--ok-line)}
.t-generated_artefact{color:var(--eu); background:var(--eu-soft); border-color:var(--eu-line)}
.t-our_product{color:var(--gold-deep); background:var(--gold-soft); border-color:var(--gold)}
.t-partner_alternative{color:var(--ink-2); background:var(--surface-2); border-color:var(--rule-2)}
.t-no_solution{color:var(--ink-3); background:transparent; border-color:var(--rule-2); border-style:dashed}
.caseid{
  font-family:var(--mono); font-size:13.5px; font-weight:600; letter-spacing:.07em; color:var(--eu);
  background:var(--eu-soft); border:1px solid var(--eu-line); padding:6px 12px; border-radius:6px; white-space:nowrap;
}
.muted{color:var(--ink-3)}
.pre{
  font-family:var(--mono); font-size:12.5px; line-height:1.7; background:var(--surface-2);
  border:1px solid var(--rule); border-radius:7px; padding:14px 16px; overflow-x:auto; color:var(--ink-2); margin:0;
  white-space:pre;
}

/* ─────────────────────────────────── front door */
.fd{min-height:62vh; display:grid; align-content:center; gap:26px; max-width:660px; margin-inline:auto; text-align:center; padding-block:clamp(24px,6vw,56px)}
.fd h1{font-family:var(--serif); font-weight:500; font-size:clamp(32px,5.6vw,52px); line-height:1.06; letter-spacing:-.02em; text-wrap:balance}
.fd .sub{font-size:clamp(16px,2.2vw,19px); color:var(--ink-2); max-width:46ch; margin-inline:auto}
.fd form{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.fd input{
  flex:1 1 320px; min-width:0; padding:15px 18px; font-size:17px; font-family:var(--mono);
  background:var(--surface); border:1px solid var(--rule-2); border-radius:8px; color:var(--ink);
}
.fd input::placeholder{color:var(--ink-3)}
.fd .btn{padding:15px 26px; font-size:16px}
.fd .fine{font-size:13.5px; color:var(--ink-3)}
.fd-trust{display:flex; gap:22px; justify-content:center; flex-wrap:wrap; font-size:13px; color:var(--ink-3); border-top:1px solid var(--rule); padding-top:20px}
.fd-trust span{display:flex; align-items:center; gap:7px}
.fd-trust span::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--ok)}

/* ─────────────────────────────────── scanning */
.scan{max-width:560px; margin-inline:auto; padding-block:clamp(28px,7vw,68px)}
.scan h2{font-family:var(--serif); font-weight:500; font-size:26px; margin-bottom:4px}
.scan-steps{display:grid; gap:2px; margin-top:26px; border:1px solid var(--rule); border-radius:9px; overflow:hidden; background:var(--rule)}
.scan-step{background:var(--surface); padding:13px 16px; display:flex; align-items:center; gap:12px; font-size:14.5px}
.scan-step .dot{width:9px; height:9px; border-radius:50%; background:var(--rule-2); flex:none}
.scan-step.on .dot{background:var(--gold); box-shadow:0 0 0 4px var(--gold-soft)}
.scan-step.ok .dot{background:var(--ok)}
.scan-step.ok{color:var(--ink-2)}
.scan-step.todo{color:var(--ink-3)}
.scan-step .t{flex:1}
.scan-step .n{font-family:var(--mono); font-size:11.5px; color:var(--ink-3)}
.scan-bar{height:4px; background:var(--surface-3); border-radius:3px; overflow:hidden; margin-top:22px}
.scan-bar i{display:block; height:100%; background:var(--eu); transition:width .5s ease}

/* ─────────────────────────────────── case page */
.case-head{display:flex; gap:16px 26px; align-items:center; flex-wrap:wrap; margin-bottom:22px}
.case-head .dom{font-family:var(--mono); font-size:15px; font-weight:500}
.case-head .dom span{display:block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:400; margin-bottom:3px}
.fixes{display:flex; align-items:baseline; gap:9px}
.fixes b{font-family:var(--serif); font-size:38px; font-weight:500; line-height:1; color:var(--ok)}
.fixes i{font-style:normal; font-size:12.5px; color:var(--ink-3); max-width:9ch; line-height:1.25}
.counts{display:flex; gap:7px; flex-wrap:wrap; margin-left:auto}
.chip{font-family:var(--mono); font-size:11px; font-weight:500; padding:5px 10px; border-radius:20px; border:1px solid; white-space:nowrap}
.c-blocking{color:var(--crit); background:var(--crit-bg); border-color:var(--crit-line)}
.c-serious{color:var(--warn); background:var(--warn-bg); border-color:var(--warn-line)}
.c-advisory{color:var(--adv); background:var(--adv-bg); border-color:var(--adv-line)}
.c-ok{color:var(--ok); background:var(--ok-bg); border-color:var(--ok-line)}
.c-eu{color:var(--eu); background:var(--eu-soft); border-color:var(--eu-line)}

.track{display:flex; border:1px solid var(--rule); border-radius:9px; overflow:hidden; background:var(--surface); flex-wrap:wrap; margin-bottom:26px}
.track div{flex:1 1 128px; padding:11px 14px 13px; border-top:3px solid var(--rule); font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.track div em{display:block; font-family:var(--sans); font-style:normal; font-size:12px; letter-spacing:0; text-transform:none; color:var(--ink-3); margin-top:3px}
.track div.on{border-top-color:var(--eu); color:var(--eu); font-weight:600}
.track div.now{border-top-color:var(--gold); color:var(--gold-deep); font-weight:600; background:var(--gold-soft)}

.case-grid{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:26px; align-items:start}
.sec-t{display:flex; align-items:baseline; gap:12px; margin-bottom:12px}
.sec-t h3{font-family:var(--serif); font-weight:500; font-size:21px}
.sec-t .n{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin-left:auto}

.f-list{display:grid; gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:10px; overflow:hidden}
.f-row{background:var(--surface); padding:14px 16px; display:grid; grid-template-columns:auto 1fr auto; gap:8px 13px; align-items:start; text-align:left; border:0; width:100%}
.f-row:hover{background:var(--surface-2)}
.f-row .fid{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); padding-top:3px}
.f-row .ft{font-size:14.5px; font-weight:600; line-height:1.35; color:var(--ink)}
.f-row .fr{grid-column:2; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--ink-3)}
.f-row.closed .ft{color:var(--ink-3); font-weight:500}
.f-row .go{color:var(--ink-3); font-size:18px; line-height:1; padding-top:2px}

.tl{list-style:none; margin:0; padding:0}
.tl li{display:grid; grid-template-columns:82px 1fr; gap:14px; padding:11px 16px; border-bottom:1px solid var(--rule); font-size:14px; color:var(--ink-2); align-items:baseline}
.tl li:last-child{border-bottom:0}
.tl time{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.tl b{color:var(--ink); font-weight:600; font-size:14.5px}
.tl .d{display:block; font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin-top:2px}
.tl .ok-t{color:var(--ok)}
.tl .alert{color:var(--warn)}
.own{font-size:13px; color:var(--ink-3); border-top:1px solid var(--rule); padding:13px 16px; background:var(--surface-2)}

/* ─────────────────────────────────── finding detail */
.fd-head{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.fd-title{font-family:var(--serif); font-weight:500; font-size:clamp(23px,3.4vw,32px); line-height:1.14; letter-spacing:-.012em; max-width:26ch; text-wrap:balance; margin-bottom:14px}
.why{font-size:16.5px; color:var(--ink-2); max-width:62ch; margin-bottom:20px}
.cites{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px}
.cite{font-family:var(--mono); font-size:11.5px; color:var(--eu); background:var(--eu-soft); border:1px solid var(--eu-line); padding:5px 10px; border-radius:5px}
.cite em{font-style:normal; color:var(--ink-3)}
.drawer summary{
  cursor:pointer; list-style:none; padding:13px 18px; font-family:var(--mono); font-size:12px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); display:flex; gap:10px; align-items:center;
}
.drawer summary::-webkit-details-marker{display:none}
.drawer summary::before{content:"▸"; color:var(--ink-3); transition:transform .15s}
.drawer[open] summary::before{transform:rotate(90deg)}
.drawer .body{padding:0 18px 18px}
.ev-cap{font-size:13px; color:var(--ink-3); margin-bottom:11px}
.ev-tbl{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px}
.ev-tbl th{text-align:left; font-weight:500; color:var(--ink-3); font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:7px 10px; border-bottom:1px solid var(--rule)}
.ev-tbl td{padding:6px 10px; border-bottom:1px solid var(--rule); color:var(--ink-2)}
.ev-tbl tr:last-child td{border-bottom:0}
.ev-tbl .same{color:var(--crit); font-weight:600}
.rem-card{border:1px solid var(--rule); border-left:4px solid var(--ok); border-radius:3px 10px 10px 3px; background:var(--surface); padding:22px 24px; margin-top:26px}
.rem-card.k-generated_artefact{border-left-color:var(--eu)}
.rem-card.k-our_product{border-left-color:var(--gold)}
.rem-card.k-partner_alternative{border-left-color:var(--rule-2)}
.rem-card.k-no_solution{border-left-color:var(--ink-3); border-left-style:dashed}
.rem-h{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.rem-h h3{font-size:19px; font-weight:700}
.rem-card p{font-size:15px; color:var(--ink-2); max-width:64ch}
.rem-opts{margin:0 0 14px; padding-left:1.15em; font-size:14.5px; color:var(--ink-2); display:grid; gap:6px}
.rem-acts{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; align-items:center}
.verified{font-family:var(--mono); font-size:12px; color:var(--ok); background:var(--ok-bg); border:1px solid var(--ok-line); padding:7px 12px; border-radius:6px}

/* ─────────────────────────────────── questions */
.q-wrap{max-width:620px; margin-inline:auto; padding-block:clamp(20px,5vw,44px)}
.q-prog{display:flex; gap:5px; margin-bottom:28px}
.q-prog i{flex:1; height:3px; border-radius:2px; background:var(--surface-3)}
.q-prog i.on{background:var(--eu)}
.q-text{font-family:var(--serif); font-weight:500; font-size:clamp(22px,3.4vw,30px); line-height:1.22; letter-spacing:-.01em; margin-bottom:14px; text-wrap:balance}
.q-why{font-size:15px; color:var(--ink-2); margin-bottom:8px}
.q-unlock{font-family:var(--mono); font-size:11.5px; color:var(--eu); margin-bottom:24px}
.q-opts{display:grid; gap:9px}
.q-opt{
  background:var(--surface); border:1px solid var(--rule-2); border-radius:9px; padding:15px 18px;
  font-size:16px; text-align:left; display:flex; align-items:center; gap:12px;
}
.q-opt:hover{border-color:var(--eu); background:var(--eu-soft)}
.q-opt.check{border-style:dashed; color:var(--ink-2)}
.q-opt .k{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-left:auto}
.q-done{text-align:center; padding-block:36px}
.q-done .big{font-family:var(--serif); font-size:28px; font-weight:500; margin-bottom:10px}

/* ─────────────────────────────────── colleagues */
.roles{display:grid; grid-template-columns:repeat(auto-fit,minmax(268px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:10px; overflow:hidden}
.role{background:var(--surface); padding:19px 20px 20px; display:flex; flex-direction:column; gap:10px}
.role .who{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--eu)}
.role h4{font-size:16px; font-weight:700}
.role .items{list-style:none; margin:0; padding:0; display:grid; gap:7px; font-size:13.5px; color:var(--ink-2)}
.role .items li{display:flex; gap:9px; align-items:baseline; line-height:1.4}
.role .items .bx{
  flex:none; width:14px; height:14px; border:1px solid var(--rule-2); border-radius:3px; margin-top:3px;
  display:inline-flex; align-items:center; justify-content:center; font-size:10px; color:transparent;
}
.role .items li.done .bx{background:var(--ok); border-color:var(--ok); color:var(--paper)}
.role .items li.done{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--rule-2)}
.role .foot{margin-top:auto; padding-top:10px; font-family:var(--mono); font-size:11px; color:var(--ink-3); border-top:1px solid var(--rule)}
.invite{margin-top:26px; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px}
.mailmock{background:var(--surface-2); border:1px solid var(--rule); border-radius:10px; padding:18px 20px; font-size:14.5px}
.mailmock .hdr{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); border-bottom:1px solid var(--rule); padding-bottom:10px; margin-bottom:12px; display:grid; gap:2px}
.dont{font-size:13.5px; color:var(--ink-3); border-left:3px solid var(--rule-2); padding-left:14px; margin-top:14px}

/* ─────────────────────────────────── supply chain */
.sc{display:grid; gap:14px; margin-top:20px}
.sc-lvl{display:grid; grid-template-columns:132px 1fr; gap:18px; align-items:start; padding-bottom:14px; border-bottom:1px solid var(--rule)}
.sc-lvl:last-child{border-bottom:0}
.sc-lvl .lb{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); padding-top:8px}
.sc-nodes{display:flex; gap:8px; flex-wrap:wrap}
.node{
  background:var(--surface); border:1px solid var(--rule-2); border-radius:7px; padding:8px 12px;
  font-size:13.5px; display:flex; gap:9px; align-items:center;
}
.node .j{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--ok); background:var(--ok-bg); border:1px solid var(--ok-line); padding:2px 6px; border-radius:3px}
.node.out .j{color:var(--warn); background:var(--warn-bg); border-color:var(--warn-line)}
.node.you{background:var(--eu-soft); border-color:var(--eu-line); font-weight:600}

/* ─────────────────────────────────── artefact */
.doc{background:var(--surface); border:1px solid var(--rule-2); border-radius:10px; box-shadow:var(--shadow); overflow:hidden; margin-top:20px}
.doc-h{padding:22px 26px; border-bottom:1px solid var(--rule); background:var(--surface-2)}
.doc-h h3{font-family:var(--serif); font-weight:500; font-size:24px; margin-bottom:4px}
.doc-h .sub{font-size:13.5px; color:var(--ink-3)}
.doc-h .from{font-family:var(--mono); font-size:11.5px; color:var(--eu); margin-top:9px}
.doc-s{padding:16px 26px; border-bottom:1px solid var(--rule)}
.doc-s h4{font-size:14.5px; font-weight:700; margin-bottom:4px}
.doc-s p{font-size:14.5px; color:var(--ink-2); margin:0; max-width:70ch}
.doc-s .tr{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-top:6px}
.doc-gap{padding:14px 26px; background:var(--warn-bg); border-bottom:1px solid var(--warn-line); font-size:13.5px; color:var(--warn)}
.doc-sign{padding:20px 26px; background:var(--surface-2); display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.doc-sign .note{font-size:13px; color:var(--ink-3); flex:1 1 280px}

/* ─────────────────────────────────── trust page */
.trust{max-width:720px; margin-inline:auto; padding-block:clamp(20px,5vw,40px)}
.trust-card{background:var(--surface); border:1px solid var(--rule-2); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.trust-h{padding:28px 30px 24px; border-bottom:1px solid var(--rule)}
.trust-h h2{font-family:var(--serif); font-weight:500; font-size:clamp(24px,4vw,32px); line-height:1.14; letter-spacing:-.014em; margin-bottom:8px}
.trust-h .meta{display:flex; gap:14px; flex-wrap:wrap; font-family:var(--mono); font-size:11.5px; color:var(--ink-3)}
.trust-st{padding:18px 30px; font-size:14.5px; color:var(--ink-2); background:var(--surface-2); border-bottom:1px solid var(--rule)}
.trust-list{list-style:none; margin:0; padding:0}
.trust-list li{display:grid; grid-template-columns:22px 1fr auto; gap:12px; padding:12px 30px; border-bottom:1px solid var(--rule); font-size:14.5px; color:var(--ink-2); align-items:baseline}
.trust-list li:last-child{border-bottom:0}
.trust-list .tick{color:var(--ok); font-weight:700}
.trust-list time{font-family:var(--mono); font-size:11.5px; color:var(--ink-3)}
.trust-f{padding:20px 30px; background:var(--surface-2); display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.trust-f .open{font-size:13px; color:var(--ink-3); max-width:44ch}

/* ─────────────────────────────────── internal */
.brief{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; margin-bottom:26px}
.sig{width:100%; border-collapse:collapse; font-size:14px}
.sig td{padding:8px 0; border-bottom:1px solid var(--rule); color:var(--ink-2)}
.sig td:last-child{text-align:right; font-family:var(--mono); font-size:12px}
.sig tr:last-child td{border-bottom:0}
.qtbl{width:100%; border-collapse:collapse; font-size:14px; min-width:720px}
.qtbl th{text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); padding:11px 14px; border-bottom:1px solid var(--rule); white-space:nowrap}
.qtbl td{padding:12px 14px; border-bottom:1px solid var(--rule); color:var(--ink-2); vertical-align:top}
.qtbl tr:last-child td{border-bottom:0}
.qtbl .cs{font-family:var(--mono); font-size:11.5px; color:var(--eu); white-space:nowrap}
.qtbl .co{font-weight:650; color:var(--ink)}
.qtbl .sc-n{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600}
.lane{font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; padding:3px 8px; border-radius:4px; border:1px solid; white-space:nowrap}
.lane-Human{color:var(--gold-deep); background:var(--gold-soft); border-color:var(--gold)}
.lane-Self-serve{color:var(--ink-2); background:var(--surface-2); border-color:var(--rule-2)}
.scroll-x{overflow-x:auto}

@media (max-width:860px){
  .case-grid{grid-template-columns:1fr}
  .sc-lvl{grid-template-columns:1fr; gap:6px}
  .tl li{grid-template-columns:1fr; gap:2px}
  .counts{margin-left:0; width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
@media print{.proto-bar,.proto-nav,.proto-note{display:none}.screen{padding:0}}

<script>
/* GDPRcompliant.eu — prototype (X-01..X-09)
   Non-functional. No network, no storage, no model calls. Every screen reads
   window.PROTO_DATA, which is fixtures/companies/eksempelbutik.json.
   Vanilla on purpose: the design system and copy port to the real app at F-01;
   the framework glue does not, so there is no point importing one here. */

(function () {
  'use strict';
  var D = window.PROTO_DATA;
  var app = document.getElementById('app');

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  var SCREENS = [
    { id: 'front',      label: 'Front door',   note: 'One field, one button, no account. The whole entry surface.' },
    { id: 'scanning',   label: 'Scanning',     note: 'The three passes, running. Real stage names, not a fake spinner.' },
    { id: 'case',       label: 'Case',         note: 'The centrepiece. Switch between the three ages of a case above.' },
    { id: 'finding',    label: 'Finding',      note: 'Evidence and the remedy. Pick any finding from the case page.' },
    { id: 'questions',  label: 'Questions',    note: 'One at a time. Yes / No / Check it for me — never a form.' },
    { id: 'colleagues', label: 'Colleagues',   note: 'Four role lists and the invitation that comes from a colleague.' },
    { id: 'supply',     label: 'Supply chain', note: 'Mapped from published documents, three levels deep.' },
    { id: 'artefact',   label: 'Artefact',     note: 'A generated processing agreement, with the sign-off step.' },
    { id: 'trust',      label: 'Trust page',   note: 'Public, opt-in. Dated work in progress — never a seal.' },
    { id: 'internal',   label: 'Internal',     note: 'What we see. Nothing here is hidden from the customer.' }
  ];

  var state = { screen: 'front', caseAge: 'working', finding: 'CNS-02', qIndex: 0, scanStep: 0 };
  var timer = null;

  /* ── derived data ────────────────────────────────────────────────── */

  function isClosed(f) {
    if (!f.closesIn) return false;
    if (state.caseAge === 'fresh') return false;
    if (state.caseAge === 'working') return f.closesIn === 'working';
    return true; // watched
  }
  function findings() {
    var list = D.findings.slice();
    if (state.caseAge === 'watched') list.push(D.newInWatch);
    return list;
  }
  function openFindings() { return findings().filter(function (f) { return !isClosed(f); }); }
  function timeline() {
    var order = { fresh: 0, working: 1, watched: 2 };
    return D.timeline.filter(function (e) { return order[e.state] <= order[state.caseAge]; });
  }
  function countBy(sev) { return openFindings().filter(function (f) { return f.severity === sev; }).length; }
  function findingById(id) {
    var all = D.findings.concat([D.newInWatch]);
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return D.findings[0];
  }

  /* ── small pieces ────────────────────────────────────────────────── */

  function sevBadge(f) {
    if (isClosed(f)) return '<span class="sev sev-closed">Closed</span>';
    return '<span class="sev sev-' + f.severity + '">' + esc(f.severity) + '</span>';
  }
  function remedyTag(r) {
    var label = { self_fix: 'free fix', generated_artefact: 'one click', our_product: 'our product', partner_alternative: 'alternatives', no_solution: 'no answer yet' }[r.kind];
    return '<span class="tag t-' + r.kind + '">' + esc(label) + '</span>';
  }
  function caseHeader() {
    var open = openFindings().length;
    return '' +
      '<div class="case-head">' +
        '<span class="caseid">' + esc(D.case.id) + '</span>' +
        '<div class="dom"><span>Case subject</span>' + esc(D.company.domain) + '</div>' +
        '<div class="fixes"><b>' + open + '</b><i>' + (open === 1 ? 'fix ready' : 'fixes ready') + '</i></div>' +
        '<div class="counts">' +
          (countBy('blocking') ? '<span class="chip c-blocking">' + countBy('blocking') + ' blocking</span>' : '') +
          (countBy('serious') ? '<span class="chip c-serious">' + countBy('serious') + ' serious</span>' : '') +
          (countBy('advisory') ? '<span class="chip c-advisory">' + countBy('advisory') + ' advisory</span>' : '') +
          '<span class="chip c-ok">' + D.checks.passed + ' passed</span>' +
          '<span class="chip c-eu">' + D.questions.filter(function (q) { return !q.answered; }).length + ' questions for you</span>' +
        '</div>' +
      '</div>';
  }

  /* ── screens ─────────────────────────────────────────────────────── */

  var render = {};

  render.front = function () {
    return '<div class="screen"><div class="fd">' +
      '<div>' +
        '<h1>Does your website actually respect a&nbsp;"no"?</h1>' +
        '<p class="sub">Most don\'t. We check in under a minute, show you the evidence, and give you the fix. Free, no account, nothing to install.</p>' +
      '</div>' +
      '<form onsubmit="return PROTO.go(\'scanning\')">' +
        '<input type="text" value="eksempelbutik.dk" aria-label="Your website address" spellcheck="false">' +

      '</form>' +
      '<p class="fine">We only look at what any visitor\'s browser can see.</p>' +
      '<div class="fd-trust">' +
        '<span>Runs in about 40 seconds</span>' +
        '<span>Hosted in the EU</span>' +
        '<span>Every finding comes with a fix</span>' +
      '</div>' +
      '</div></div>';
  };

  var SCAN_STEPS = [
    ['Opening the page with a clean browser', 'pass A'],
    ['Recording what loads before you agree', 'pass A'],
    ['Finding the consent banner', 'pass B'],
    ['Clicking through to a real refusal', 'pass B'],
    ['Recording what still loads after refusing', 'pass B'],
    ['Accepting everything, for comparison', 'pass C'],
    ['Reading your privacy policy', 'notice'],
    ['Identifying who receives the data', 'recipients'],
    ['Checking the security a visitor can see', 'security'],
    ['Writing up what we found', '']
  ];

  render.scanning = function () {
    var pct = Math.round((state.scanStep / SCAN_STEPS.length) * 100);
    var rows = SCAN_STEPS.map(function (s, i) {
      var cls = i < state.scanStep ? 'ok' : i === state.scanStep ? 'on' : 'todo';
      return '<div class="scan-step ' + cls + '"><span class="dot"></span><span class="t">' + esc(s[0]) + '</span><span class="n">' + esc(s[1]) + '</span></div>';
    }).join('');
    var done = state.scanStep >= SCAN_STEPS.length;
    return '<div class="screen"><div class="scan">' +
      '<p class="eyebrow">Checking</p>' +
      '<h2>' + esc(D.company.domain) + '</h2>' +
      '<p class="muted" style="font-size:14.5px">We load your front page three times — once ignoring the banner, once refusing everything, once accepting — and compare what happens.</p>' +
      '<div class="scan-bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="scan-steps">' + rows + '</div>' +
      (done
        ? '<div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">' +
            '<button class="btn" onclick="PROTO.go(\'case\')">Open case ' + esc(D.case.id) + '</button>' +
            '<span class="muted" style="font-size:13.5px">12 findings · 12 fixes ready</span></div>'
        : '<p class="muted" style="margin-top:22px;font-size:13.5px">This normally takes about 40 seconds.</p>') +
      '</div></div>';
  };

  render.case = function () {
    var order = { fresh: 0, working: 1, watched: 2 };
    var trackHtml = D.track.map(function (t, i) {
      var reached = i <= (state.caseAge === 'fresh' ? 1 : state.caseAge === 'working' ? 2 : 4);
      var current = (state.caseAge === 'fresh' && i === 1) || (state.caseAge === 'working' && i === 2) || (state.caseAge === 'watched' && i === 4);
      var sub = t.sub;
      if (t.key === 'working') sub = (findings().length - openFindings().length) + ' of ' + findings().length + ' closed';
      return '<div class="' + (current ? 'now' : reached ? 'on' : '') + '">' + esc(t.label) + '<em>' + esc(sub) + '</em></div>';
    }).join('');

    var list = findings().sort(function (a, b) {
      var w = { blocking: 0, serious: 1, advisory: 2 };
      return (isClosed(a) - isClosed(b)) || (w[a.severity] - w[b.severity]);
    }).map(function (f) {
      return '<button class="f-row' + (isClosed(f) ? ' closed' : '') + '" onclick="PROTO.openFinding(\'' + f.id + '\')">' +
        '<span class="fid">' + esc(f.id) + '</span>' +
        '<span class="ft">' + esc(f.title) + '</span>' +
        '<span class="go">›</span>' +
        '<span class="fr">' + sevBadge(f) + (isClosed(f) ? '' : remedyTag(f.remedy) + '<span>' + esc(f.remedy.title) + '</span>') + '</span>' +
      '</button>';
    }).join('');

    var tl = timeline().slice().reverse().map(function (e) {
      return '<li><time>' + esc(e.at) + '</time><span>' +
        '<b class="' + (e.alert ? 'alert' : e.closed ? 'ok-t' : '') + '">' + esc(e.text) + '</b>' +
        '<span class="d">' + esc(e.detail) + '</span></span></li>';
    }).join('');

    return '<div class="screen">' + caseHeader() +
      '<div class="track">' + trackHtml + '</div>' +
      '<div class="case-grid">' +
        '<div>' +
          '<div class="sec-t"><h3>What we found</h3><span class="n">' + findings().length + ' findings · every one with a fix</span></div>' +
          '<div class="f-list">' + list + '</div>' +
          '<div class="sec-t" style="margin-top:28px"><h3>What we could not determine</h3><span class="n">' + D.undetermined.length + ' open questions</span></div>' +
          '<div class="f-list">' + D.undetermined.map(function (u) {
            return '<div class="f-row" style="cursor:default;grid-template-columns:auto 1fr">' +
              '<span class="fid">' + esc(u.id) + '</span>' +
              '<span class="ft">' + esc(u.title) + '</span>' +
              '<span class="fr" style="grid-column:2"><span class="tag t-no_solution">not determined</span>' +
              '<span style="flex:1 1 100%;line-height:1.45;margin-top:2px">' + esc(u.reason) + '</span>' +
              '<span class="mono" style="font-size:11.5px;color:var(--eu)">→ ' + esc(u.resolve) + '</span></span>' +
            '</div>';
          }).join('') + '</div>' +
          '<p class="muted" style="margin-top:16px;font-size:14px">' +
            (state.caseAge === 'fresh' ? 'Four more things we could only check with your permission. ' : 'These resolve as you answer. ') +
            '<button class="btn btn-2 btn-sm" onclick="PROTO.go(\'questions\')">Go deeper — still free</button></p>' +
        '</div>' +
        '<div>' +
          '<div class="sec-t"><h3>What has happened</h3><span class="n">' + timeline().length + ' entries</span></div>' +
          '<div class="card"><ul class="tl">' + tl + '</ul>' +
            '<p class="own" style="margin:0">This case belongs to ' + esc(D.company.legalName) + '. ' + esc(D.case.participants) + ' people can see it. ' +
            'You can export or delete all of it at any time — including the evidence we stored.</p></div>' +
          '<div style="margin-top:20px;display:flex;gap:9px;flex-wrap:wrap">' +
            '<button class="btn btn-2 btn-sm" onclick="PROTO.go(\'colleagues\')">Share inward</button>' +
            '<button class="btn btn-2 btn-sm" onclick="PROTO.go(\'trust\')">Share outward</button>' +
            '<button class="btn btn-2 btn-sm" onclick="PROTO.go(\'supply\')">Supply chain</button>' +
          '</div>' +
        '</div>' +
      '</div></div>';
  };

  render.finding = function () {
    var f = findingById(state.finding);
    var r = f.remedy;
    var closed = isClosed(f);

    var ev = '';
    if (f.evidence.kind === 'diff') {
      ev = '<table class="ev-tbl"><thead><tr><th>Host</th><th>Reject all</th><th>Accept all</th><th>Verdict</th></tr></thead><tbody>' +
        f.evidence.rows.map(function (row) {
          return '<tr><td>' + esc(row[0]) + '</td><td>' + esc(row[1]) + '</td><td>' + esc(row[2]) + '</td>' +
            '<td class="' + (row[3] === 'identical' ? 'same' : '') + '">' + esc(row[3]) + '</td></tr>';
        }).join('') + '</tbody></table>';
    } else {
      ev = '<pre class="pre">' + f.evidence.lines.map(esc).join('\n') + '</pre>';
    }

    var acts = '';
    if (closed) {
      acts = '<span class="verified">✓ Closed and verified by re-scan</span>';
    } else if (r.kind === 'no_solution') {
      acts = '<button class="btn btn-2" onclick="PROTO.noop(this)">' + esc(r.askLabel) + '</button>' +
             '<span class="muted" style="font-size:13px">Logged to the demand ledger · seen 1,847 times</span>';
    } else {
      acts = '<button class="btn" onclick="PROTO.noop(this)">' + esc(r.cta || 'Show me how') + '</button>' +
             (r.verifyLabel ? '<button class="btn btn-2" onclick="PROTO.verify(this)">' + esc(r.verifyLabel) + '</button>' : '');
    }

      '<button class="btn btn-2 btn-sm" onclick="PROTO.go(\'case\')" style="margin-bottom:22px">‹ Back to case ' + esc(D.case.id) + '</button>' +
      '<div class="fd-head"><span class="fid mono muted">' + esc(f.id) + '</span>' + sevBadge(f) + '<span class="muted" style="font-size:13px">' + esc(f.area) + '</span></div>' +
      '<h2 class="fd-title h-serif">' + esc(f.title) + '</h2>' +
      '<p class="why">' + esc(f.why) + '</p>' +
      (f.citations.length
        ? '<div class="cites">' + f.citations.map(function (c) {
            return '<span class="cite">' + esc(c.instrument) + ' ' + esc(c.ref) + ' <em>· ' + esc(c.note) + '</em></span>';
          }).join('') + '</div>'
        : '<div class="cites"><span class="cite" style="color:var(--ink-3);background:transparent;border-style:dashed">No legal claim made — this is an observation</span></div>') +
      '<details class="drawer card" open><summary>The evidence behind this</summary><div class="body">' +
        '<p class="ev-cap">' + esc(f.evidence.caption) + '</p>' + ev +
      '</div></details>' +
      '<div class="rem-card k-' + r.kind + '">' +
        '<div class="rem-h"><h3>' + esc(r.title) + '</h3>' + remedyTag(r) + '<span class="muted mono" style="font-size:11.5px;margin-left:auto">' + esc(r.effort) + '</span></div>' +
        '<p>' + esc(r.detail) + '</p>' +
        (r.options ? '<ul class="rem-opts">' + r.options.map(function (o) { return '<li>' + esc(o) + '</li>'; }).join('') + '</ul>' : '') +
        (r.snippet ? '<pre class="pre">' + esc(r.snippet) + '</pre>' : '') +
        (r.alternativeNote ? '<p class="muted" style="font-size:13.5px">' + esc(r.alternativeNote) + '</p>' : '') +
        '<div class="rem-acts">' + acts + '</div>' +
      '</div></div>';
  };

  render.questions = function () {
    var qs = D.questions;
    if (state.qIndex >= qs.length) {
      return '<div class="screen"><div class="q-wrap q-done">' +
        '<div class="big">That is everything we need for now.</div>' +
        '<p class="muted">Four answers opened nine new checks and filled eleven rows of your processing register. ' +
        'We will come back to you when something needs a decision.</p>' +
        '<div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn" onclick="PROTO.go(\'case\')">Back to the case</button>' +
        '<button class="btn btn-2" onclick="PROTO.resetQ()">Run through again</button></div>' +
      '</div></div>';
    }
    var q = qs[state.qIndex];
    var prog = qs.map(function (_, i) { return '<i class="' + (i <= state.qIndex ? 'on' : '') + '"></i>'; }).join('');
    var opts = q.options.map(function (o) {
      var isCheck = /check it for me|not sure|don't know/i.test(o);
      return '<button class="q-opt' + (isCheck ? ' check' : '') + '" onclick="PROTO.answer()">' + esc(o) +
        (isCheck ? '<span class="k">we go and look</span>' : '') + '</button>';
    }).join('');
    return '<div class="screen"><div class="q-wrap">' +
      '<div class="q-prog">' + prog + '</div>' +
      '<p class="eyebrow">Question ' + (state.qIndex + 1) + ' of ' + qs.length + '</p>' +
      '<h2 class="q-text">' + esc(q.text) + '</h2>' +
      '<p class="q-why">' + esc(q.why) + '</p>' +
      '<p class="q-unlock">Answering this unlocks ' + esc(q.unlocks) + '</p>' +
      '<div class="q-opts">' + opts + '</div>' +
      '<p class="muted" style="margin-top:22px;font-size:13px">We only ask what we cannot work out ourselves, and only when the answer changes something.</p>' +
    '</div></div>';
  };

  render.colleagues = function () {
    var roles = D.roles.map(function (r) {
      var items = r.items.map(function (it) {
        return '<li class="' + (it.done ? 'done' : '') + '"><span class="bx">✓</span><span>' + esc(it.text) + '</span></li>';
      }).join('');
      return '<div class="role">' +
        '<div class="who">' + esc(r.who) + '</div>' +
        '<h4>' + esc(r.person) + '</h4>' +
        '<ul class="items">' + items + '</ul>' +
        '<div class="foot">' + r.items.length + ' items · ' + esc(r.eta) + ' · ' + r.done + ' done · ' + r.auto + ' we can do for you</div>' +
      '</div>';
    }).join('');

    return '<div class="screen">' +
      '<p class="eyebrow">Share inward</p>' +
      '<h2 class="h-serif" style="font-size:clamp(24px,3.6vw,34px);margin-bottom:10px">Four people, twenty minutes each</h2>' +
      '<p class="muted" style="max-width:62ch;font-size:15.5px">Nobody receives a questionnaire. Each person gets a short list of things they actually control, with a button on every one, and an option to say "I don\'t know, check for me".</p>' +
      '<div class="roles" style="margin-top:24px">' + roles + '</div>' +
      '<div class="invite">' +
        '<div class="mailmock">' +
          '<div class="hdr"><span>From: <b>Mette Sørensen</b> &lt;mette@eksempelbutik.dk&gt;</span><span>To: hr@eksempelbutik.dk</span><span>Subject: 4 things for HR — 20 minutes</span></div>' +
          '<p style="margin:0 0 10px">Hi — we\'re fixing our GDPR situation and there are four things only you can answer. Two of them are already drafted, you just approve.</p>' +
          '<p style="margin:0 0 14px"><a href="#" onclick="return false" style="color:var(--eu)">Open my four items →</a></p>' +
          '<p class="muted" style="margin:0;font-size:13px">No account needed. You\'ll see only your part.</p>' +
        '</div>' +
        '<div>' +
          '<h4 style="font-size:16px;margin-bottom:8px">Why it comes from Mette</h4>' +
          '<p class="muted" style="font-size:14.5px">An invitation from a colleague gets opened. An invitation from a vendor nobody has heard of gets deleted. The case sends it in her name, and she can see who hasn\'t finished.</p>' +
          '<div class="dont">We never email their colleagues on our own initiative, and the invitation link is single-purpose, expiring and revocable.</div>' +
        '</div>' +
      '</div></div>';
  };

  render.supply = function () {
    var sc = D.supplyChain;
    var levels = [0, 1, 2, 3].map(function (lv) {
      var nodes = sc.nodes.filter(function (n) { return n.level === lv; }).map(function (n) {
        var outside = n.juris && ['US', 'CA'].indexOf(n.juris) >= 0;
        var flag = n.parent ? n.juris + ' · parent ' + n.parent : n.juris;
        return '<div class="node' + (lv === 0 ? ' you' : '') + (outside || n.parent ? ' out' : '') + '">' +
          '<span>' + esc(n.label) + '</span><span class="j">' + esc(flag) + '</span></div>';
      }).join('');
      return '<div class="sc-lvl"><div class="lb">' + esc(sc.levels[lv]) + '</div><div class="sc-nodes">' + nodes + '</div></div>';
    }).join('');

    return '<div class="screen">' +
      '<p class="eyebrow">Mapped from published documents · 3 September</p>' +
      '<h2 class="h-serif" style="font-size:clamp(24px,3.6vw,34px);margin-bottom:10px">Who else touches your customers\' data</h2>' +
      '<p class="muted" style="max-width:64ch;font-size:15.5px">We read your vendors\' own processing agreements and sub-processor lists, then read theirs. Nobody at ' + esc(D.company.legalName) + ' has ever seen this list in full — and neither had your vendors\' own customers.</p>' +
      '<div class="card pad sc" style="margin-top:22px">' + levels + '</div>' +
      '<div style="margin-top:18px;display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px" class="muted">' +
        '<span><b style="color:var(--ink)">21</b> sub-processors</span>' +
        '<span><b style="color:var(--ink)">9</b> established outside the EEA</span>' +
        '<span><b style="color:var(--ink)">3</b> levels deep</span>' +
        '<span>Every edge carries the document and date it came from</span>' +
      '</div>' +
      '<div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap">' +
        '<button class="btn" onclick="PROTO.go(\'artefact\')">Publish this as your sub-processor list</button>' +
        '<button class="btn btn-2" onclick="PROTO.noop(this)">Export as PDF</button>' +
      '</div></div>';
  };

  render.artefact = function () {
    var a = D.artefact;
    return '<div class="screen narrow">' +
      '<p class="eyebrow">Generated artefact · preview before anything is published</p>' +
      '<h2 class="h-serif" style="font-size:clamp(24px,3.6vw,32px);margin-bottom:8px">This describes what you actually do</h2>' +
      '<p class="muted" style="max-width:62ch;font-size:15.5px">Every clause traces to something in your case. Where the register has a gap, it says so instead of inventing text.</p>' +
      '<div class="doc">' +
        '<div class="doc-h"><h3>' + esc(a.title) + '</h3><div class="sub">' + esc(a.subtitle) + '</div>' +
          '<div class="from">Generated from ' + esc(a.generatedFrom) + '</div></div>' +
        a.sections.map(function (s) {
          return '<div class="doc-s"><h4>' + esc(s.h) + '</h4><p>' + esc(s.body) + '</p><div class="tr">traces to: ' + esc(s.traces) + '</div></div>';
        }).join('') +
        a.gaps.map(function (g) { return '<div class="doc-gap">⚠ ' + esc(g) + '</div>'; }).join('') +
        '<div class="doc-sign">' +
          '<button class="btn" onclick="PROTO.noop(this)">Sign as ' + esc(a.signoff.who) + '</button>' +
          '<span class="note">' + esc(a.signoff.note) + '</span>' +
        '</div>' +
      '</div></div>';
  };

  render.trust = function () {
    var t = D.trust;
    return '<div class="screen"><div class="trust">' +
      '<p class="eyebrow" style="text-align:center;margin-bottom:14px">What their customers see · published by them, not by us</p>' +
      '<div class="trust-card">' +
        '<div class="trust-h"><h2>' + esc(t.headline) + '</h2>' +
          '<div class="meta"><span>Last checked ' + esc(t.updated) + '</span><span>Case ' + esc(t.caseRef) + '</span><span>Checked by GDPRcompliant.eu</span></div></div>' +
        '<div class="trust-st">' + esc(t.statement) + '</div>' +
        '<ul class="trust-list">' + t.closed.map(function (c) {
          return '<li><span class="tick">✓</span><span>' + esc(c.text) + '</span><time>' + esc(c.on) + '</time></li>';
        }).join('') + '</ul>' +
        '<div class="trust-f">' +
          '<span class="open">' + esc(t.openNote) + '</span>' +
          '<button class="btn" onclick="PROTO.go(\'front\')">' + esc(t.cta) + '</button>' +
        '</div>' +
      '</div>' +
      '<p class="muted" style="font-size:13px;margin-top:16px;text-align:center;max-width:58ch;margin-inline:auto">' +
        'Off by default. Publishing is an explicit, reversible act recorded on the timeline. It never says approved, certified or compliant — and it never lists what is still open.</p>' +
    '</div></div>';
  };

  render.internal = function () {
    var b = D.internal.brief;
    var sig = b.signals.map(function (s) {
      return '<tr><td>' + esc(s[0]) + '</td><td>' + esc(s[1]) + '</td></tr>';
    }).join('');
    var rows = D.internal.queue.map(function (q) {
      return '<tr>' +
        '<td class="cs">' + esc(q.case) + '</td>' +
        '<td class="co">' + esc(q.company) + '<div class="muted" style="font-weight:400;font-size:12.5px">' + esc(q.why) + '</div></td>' +
        '<td><span class="lane lane-' + esc(q.lane.replace(' ', '-')) + '">' + esc(q.lane) + '</span></td>' +
        '<td class="sc-n">' + q.score + '</td>' +
        '<td class="sc-n">' + q.open + '</td>' +
        '<td>' + esc(q.hook) + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="screen">' +
      '<p class="eyebrow">Internal · consultant view of the customer\'s own case</p>' +
      '<h2 class="h-serif" style="font-size:clamp(24px,3.6vw,32px);margin-bottom:16px">Already briefed, before hello</h2>' +
      '<div class="brief">' +
        '<div class="card pad">' +
          '<div class="sec-t"><h3 style="font-size:18px">' + esc(b.headline) + '</h3>' +
            '<span class="lane lane-Self-serve" style="margin-left:auto">' + esc(b.lane) + ' · ' + b.score + '</span></div>' +
          '<table class="sig"><tbody>' + sig + '</tbody></table>' +
        '</div>' +
        '<div class="card pad">' +
          '<h3 style="font-family:var(--serif);font-weight:500;font-size:18px;margin-bottom:10px">The read</h3>' +
          '<p style="font-size:14.5px;color:var(--ink-2)">' + esc(b.read) + '</p>' +
          '<div class="dont" style="margin-top:14px">' + esc(b.visible) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="sec-t"><h3>Commercial queue</h3><span class="n">ranked by signal × severity × how much we can solve</span></div>' +
      '<div class="card scroll-x"><table class="qtbl"><thead><tr>' +
        '<th>Case</th><th>Company</th><th>Lane</th><th>Signal</th><th>Open</th><th>What to open the call with</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="muted" style="font-size:13.5px;margin-top:16px;max-width:66ch">Lane changes nothing about what the customer receives — it only decides whether a person reaches out. ' +
      'Small companies get the entire automated product; larger ones get the entire automated product plus a consultant.</p>' +
    '</div></div>';
  };

  /* ── chrome and routing ──────────────────────────────────────────── */

  function chrome() {
    var nav = SCREENS.map(function (s) {
      return '<button onclick="PROTO.go(\'' + s.id + '\')" aria-current="' + (state.screen === s.id) + '">' + esc(s.label) + '</button>';
    }).join('');
    var meta = SCREENS.filter(function (s) { return s.id === state.screen; })[0];
    var ageToggle = state.screen === 'case'
      ? '<span style="margin-left:auto;display:flex;gap:6px;align-items:center">Age of case:' +
        ['fresh', 'working', 'watched'].map(function (a) {
          return '<button class="btn btn-2 btn-sm" style="' + (state.caseAge === a ? 'border-color:var(--gold);background:var(--gold-soft)' : '') + '" onclick="PROTO.age(\'' + a + '\')">' +
            (a === 'fresh' ? 'Day one' : a === 'working' ? 'Week one' : 'Under watch') + '</button>';
        }).join('') + '</span>'
      : '';
    return '<div class="proto-bar">' +
        '<span class="proto-badge">Prototype · nothing behind it</span>' +
        '<span class="proto-name"><b>GDPRcompliant.eu</b> · X-01…X-09</span>' +
        '<nav class="proto-nav">' + nav + '</nav>' +
      '</div>' +
      '<div class="proto-note"><b>Showing</b><span>' + esc(meta ? meta.note : '') + '</span>' + ageToggle + '</div>';
  }

  function draw() {
    app.innerHTML = chrome() + (render[state.screen] || render.front)();
    window.scrollTo(0, 0);
    if (state.screen === 'scanning') startScan(); else stopScan();
  }

  function startScan() {
    stopScan();
    if (state.scanStep >= SCAN_STEPS.length) return;
    timer = setInterval(function () {
      state.scanStep++;
      if (state.scanStep >= SCAN_STEPS.length) stopScan();
      if (state.screen === 'scanning') draw();
    }, 700);
  }
  function stopScan() { if (timer) { clearInterval(timer); timer = null; } }

  // Sandboxed embeds can refuse history writes. Deep links are a convenience,
  // not a requirement — never let one break the app.
  function setHash(v) { try { location.hash = v; } catch (e) { /* ignore */ } }

  window.PROTO = {
    go: function (id) {
      if (id === 'scanning') state.scanStep = 0;
      state.screen = id;
      setHash('#/' + id);
      draw();
      return false;
    },
    openFinding: function (id) { state.finding = id; state.screen = 'finding'; setHash('#/finding'); draw(); },
    age: function (a) { state.caseAge = a; draw(); },
    answer: function () { state.qIndex++; draw(); },
    resetQ: function () { state.qIndex = 0; draw(); },
    verify: function (btn) {
      btn.outerHTML = '<span class="verified">✓ Re-checked — this finding is now closed</span>';
    },
    noop: function (btn) {
      var t = btn.textContent;
      btn.textContent = 'Not wired up — prototype';
      btn.disabled = true;
      setTimeout(function () { btn.textContent = t; btn.disabled = false; }, 1400);
    }
  };

  var fromHash = '';
  try { fromHash = (location.hash || '').replace('#/', ''); } catch (e) { /* ignore */ }
  if (render[fromHash]) state.screen = fromHash;
  draw();
})();
</script>
