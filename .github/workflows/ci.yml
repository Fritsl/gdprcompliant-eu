name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Linux and Windows both, because F-01 says a clean clone must work on either.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint
      # Every table carries row-level security, or the build fails (F-05); every finding
      # type carries a remedy in every jurisdiction, or the build fails (R-02).
      - run: pnpm check:rls
      - run: pnpm check:finding-completeness
      - run: pnpm check:retention
      # Every citation in the content set resolves to a paragraph as published (T-03).
      - run: pnpm check:citations
      - run: pnpm format:check
      - run: pnpm test:unit
      # Planted instructions in scanned content must gain nothing (A-10); poisoned claims
      # must not pass the verifier (A-07). A successful attack fails the build.
      - run: pnpm test:adversarial
      # The prototype is the design specification; its 430 assertions encode product
      # rules, so a change that breaks one must fail here too.
      - run: pnpm proto

  # Tenant isolation is proven on every push, not nightly (T-07): the two tenancy suites
  # against a real Postgres with the same image as docker-compose.
  tenancy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gc
          POSTGRES_PASSWORD: gc
          POSTGRES_DB: gc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gc -d gc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GC_TEST_DATABASE_URL: postgres://gc:gc@localhost:5432/gc_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --project integration tests/integration/tenancy.test.ts tests/integration/tenancy-matrix.test.ts

  # The journeys (T-09): every e2e suite in a real browser against the fixture estate,
  # with the worker in-process, on every push. Deterministic, because the estate is.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gc
          POSTGRES_PASSWORD: gc
          POSTGRES_DB: gc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gc -d gc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GC_TEST_DATABASE_URL: postgres://gc:gc@localhost:5432/gc_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm web:build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: artifacts/
          if-no-files-found: ignore
