name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Linux and Windows both, because F-01 says a clean clone must work on either.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint
      # Every table carries row-level security, or the build fails (F-05); every finding
      # type carries a remedy in every jurisdiction, or the build fails (R-02).
      - run: pnpm check:rls
      - run: pnpm check:finding-completeness
      - run: pnpm check:retention
      - run: pnpm format:check
      - run: pnpm test:unit
      # The prototype is the design specification; its 430 assertions encode product
      # rules, so a change that breaks one must fail here too.
      - run: pnpm proto
